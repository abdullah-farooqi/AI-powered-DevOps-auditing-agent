[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-repo-auditor"
version = "0.2.0"
description = "Hardened AI agent for evidence-backed DevOps repository auditing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Ahmad Farooqi" }
]
dependencies = [
    "google-genai>=2.32.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "regex>=2024.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
devops-audit = "agent:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "agent_loop", "llm", "prompts", "report", "tools"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
